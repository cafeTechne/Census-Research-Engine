name: Offline CI & Release Hygiene

on:
  push:
    branches: [defaultBranch, main]
  pull_request:
    branches: [defaultBranch, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Release hygiene & Layer B isolation check
        run: python scripts/release_hygiene_check.py

      - name: Environment & bundled data integrity check (doctor --verbose)
        run: python -m census doctor --verbose --json

      - name: Run Layer B & core contract tests (offline)
        env:
          MPLCONFIGDIR: /tmp/matplotlib-ci
        run: |
          pytest -q layer_b_openscholar/tests/ \
            tests/test_packaging.py \
            tests/test_mcp_profiles.py \
            tests/test_agent_routing.py \
            tests/test_track_a_manifest_parity.py \
            tests/test_track_b_bibtex_bundle.py \
            tests/test_proposition_verification.py \
            tests/test_round185.py \
            tests/test_round186.py \
            tests/test_round187.py \
            tests/test_round189.py \
            tests/test_round190.py \
            tests/test_round192.py \
            tests/test_round193.py \
            tests/test_round194.py \
            tests/test_round196.py \
            tests/test_round198.py \
            tests/test_round199.py
